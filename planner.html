 vals.forEach((v,i)=>{const h=H*v/max,x=L+gap/2+i*(bw+gap);
  s+=`<rect x="${x}" y="${10+H-h}" width="${bw}" height="${h}" rx="5" fill="${i%2?'#7c5cd6':'var(--b)'}"/><text x="${x+bw/2}" y="${6+H-h}" font-size="8" text-anchor="middle" fill="#1b2a5c">${fmtv(v)}</text><text x="${x+bw/2}" y="${H+26}" font-size="9" text-anchor="middle" fill="#1b2a5c">${D[i]}</text>`});
